[package]
name = "scatter"
version = "0.1.0"
edition = "2024"
description = "A system-time-driven atmospheric sky rendered with wgpu"
license = "MIT OR Apache-2.0"

[dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
pollster = "0.4"
wgpu = "29.0.3"
winit = "0.30.13"

[profile.release]
lto = "thin"
strip = true

